# Toggle to true when the integration test should hit the real Globus services.
globus.test.enabled=false

# Globus Auth configuration
globus.auth.client-id=
# Comma or space separated scopes required for the workflow (for example: "urn:globus:auth:scope:transfer.api.globus.org:all")
globus.auth.scope=
# Duration the integration test should poll for tokens before timing out (ISO-8601 duration)
globus.auth.poll-timeout=PT5M

# Transfer specific configuration
globus.transfer.resource-server=transfer.api.globus.org
globus.transfer.mapped-collection-id=
globus.transfer.list-path=
globus.transfer.guest-base-path=
globus.transfer.guest-display-name-prefix=java-sdk-test
globus.transfer.guest-public=false
globus.transfer.identity-principal=
globus.transfer.permission-path=/
globus.transfer.permission=r
